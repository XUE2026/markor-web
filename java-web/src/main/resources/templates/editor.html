<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Markor Web - Java Edition</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1 th:text="${title}">Markor Web - Java Edition</h1>
            <nav>
                <a href="/">编辑器</a>
                <span class="mode-indicator">模式: <span th:text="${mode}">full</span></span>
            </nav>
        </header>

        <main>
            <div class="editor-container">
                <aside class="sidebar">
                    <h3>文件列表</h3>
                    <div id="file-list"></div>
                </aside>

                <section class="editor-main">
                    <div class="editor-header">
                        <input type="text" id="current-file" placeholder="文件名" value="">
                        <button onclick="saveFile()" class="btn btn-success">保存</button>
                    </div>

                    <div class="editor-content">
                        <div class="editor-pane">
                            <textarea id="editor" placeholder="在这里输入 Markdown..."></textarea>
                        </div>
                        <div class="preview-pane">
                            <div id="preview" class="markdown-body"></div>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 Markor Web - Java Edition. 基于 Markor 项目。</p>
        </footer>
    </div>

    <script th:inline="javascript">
        const mode = [[${mode}]];
        const targetFile = [[${targetFile}]];
    </script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
