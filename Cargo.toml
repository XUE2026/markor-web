[package]
name = "markor-web"
version = "0.1.0"
edition = "2021"
authors = ["Markor Team"]
description = "Markor Web - Rust Edition"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
markdown = "0.9"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
log = "0.4"
dirs = "5"
once_cell = "1"

[[bin]]
name = "markor-web"
path = "src/main.rs"
