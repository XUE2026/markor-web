name: "Build Python Web"

on:
  push:
    branches:
      - python-web
  pull_request:
    branches:
      - python-web

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          pip install flask markdown pygments
        fi

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Build package
      run: |
        mkdir -p dist/python-web
        cp -r . dist/python-web/
        ls -la dist/python-web/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-web-py${{ matrix.python-version }}
        path: dist/python-web
        retention-days: 14