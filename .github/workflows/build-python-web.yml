name: "Build Python Web"

on:
  push:
    branches:
      - python-web
  pull_request:
    branches:
      - python-web

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: python-web

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        cd python-web
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true
        pip install flask markdown pygments

    - name: Lint with flake8
      run: |
        pip install flake8
        cd python-web
        flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 app.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p dist
        cd python-web
        cp -r * ../dist/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-web
        path: dist
        retention-days: 14
