name: "Build Java Web"

on:
  push:
    branches:
      - java-web
  pull_request:
    branches:
      - java-web

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: java-web

    - name: Set up Java ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build with Gradle
      run: |
        cd java-web
        ./gradlew clean bootJar
        ls -la build/libs/

    - name: Build package
      run: |
        mkdir -p dist/java-web
        cd java-web
        cp -r . ../dist/java-web/
        cp build/libs/*.jar ../dist/java-web/ || true
        ls -la ../dist/java-web/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-web-jdk${{ matrix.java-version }}
        path: dist/java-web
        retention-days: 14
