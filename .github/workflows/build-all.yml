name: "Build All Versions"

on:
  push:
    branches:
      - master
  release:
    types: [created]

jobs:
  # 触发 Python Web 构建
  trigger-python-web:
    if: github.event_name == 'push' || github.event_name == 'release'
    uses: ./.github/workflows/build-python-web.yml
    secrets: inherit

  # 触发 PHP Web 构建
  trigger-php-web:
    if: github.event_name == 'push' || github.event_name == 'release'
    uses: ./.github/workflows/build-php-web.yml
    secrets: inherit

  # 触发 Rust Web 构建
  trigger-rust-web:
    if: github.event_name == 'push' || github.event_name == 'release'
    uses: ./.github/workflows/build-rust-web.yml
    secrets: inherit

  # 触发 Java Web 构建
  trigger-java-web:
    if: github.event_name == 'push' || github.event_name == 'release'
    uses: ./.github/workflows/build-java-web.yml
    secrets: inherit

  # 触发 APK 构建
  trigger-apk:
    if: github.event_name == 'push' || github.event_name == 'release'
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit
