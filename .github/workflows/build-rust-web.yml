name: "Build Rust Web"

on:
  push:
    branches:
      - rust-web
  pull_request:
    branches:
      - rust-web

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: ['stable']
        target:
          - x86_64-unknown-linux-gnu

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: rust-web

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ matrix.rust-version }}
        targets: ${{ matrix.target }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Build
      run: |
        cd rust-web
        cargo build --release
        ls -la target/release/

    - name: Build package
      run: |
        mkdir -p dist/rust-web
        cd rust-web
        cp -r . ../dist/rust-web/
        cp target/release/markor-web ../dist/rust-web/ || true
        ls -la ../dist/rust-web/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rust-web-${{ matrix.target }}
        path: dist/rust-web
        retention-days: 14
