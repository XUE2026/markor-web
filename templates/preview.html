{% extends "base.html" %}

{% block title %}Markor Web - 预览: {{ filename }}{% endblock %}

{% block content %}
<div class="preview-container">
    <div class="preview-header">
        <h2>{{ filename }}</h2>
        <a href="/" class="btn btn-secondary">返回</a>
    </div>
    <div class="preview-content markdown-body">
        {{ content|safe }}
    </div>
</div>
{% endblock %}
